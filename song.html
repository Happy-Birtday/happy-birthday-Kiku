<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Song</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">♥ Happy Birthday Kiku</div>
  </header>

  <main class="page-wrapper">
    <div class="pink-card">
      
      <div class="polaroid-wrapper">
        <div class="birthday-tag">BIRTHDAY GIRL</div>
        <div class="polaroid-frame">
          <div class="photo-box">
            <img src="Photo11.jpg" alt="Birthday Girl">
          </div>
        </div>
        <div class="stickers">🐶🌸</div>
      </div>

      <div class="player-wrapper">
        <div class="video-container">
          <video id="myVideo" poster="Photo12.jpg">
            <source src="HappyBirthday.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>

        <div class="audio-controls">
          <div class="progress-bar-container" id="progressBar">
            <div class="progress-line">
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-dot" id="progressDot"></div>
            </div>
          </div>

          <div class="control-buttons">
            <button class="nav-btn" id="prevBtn" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button class="circle-play-btn" id="playBtn" aria-label="Play/Pause">
              <span id="playIcon">▶</span>
            </button>

            <button class="nav-btn" id="nextTrackBtn" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <button id="nextBtn" class="next-btn">NEXT 🌸</button>
  </main>

  <script>
    const video = document.getElementById('myVideo');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressFill = document.getElementById('progressFill');
    const progressDot = document.getElementById('progressDot');
    const progressBar = document.getElementById('progressBar');

    function togglePlay() {
      if (video.paused) {
        video.play();
        playIcon.textContent = '❚❚';
        playIcon.style.fontSize = '12px';
      } else {
        video.pause();
        playIcon.textContent = '▶';
        playIcon.style.fontSize = '14px';
      }
    }

    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    // Sync line and dot with video progress
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const percentage = (video.currentTime / video.duration) * 100;
        progressFill.style.width = percentage + '%';
        progressDot.style.left = percentage + '%';
      }
    });

    // Seek on click
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      video.currentTime = clickPos * video.duration;
    });

    video.addEventListener('ended', () => {
      playIcon.textContent = '▶';
      progressFill.style.width = '0%';
      progressDot.style.left = '0%';
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      window.location.href = 'happy.html';
    });
  </script>

</body>
</html>
